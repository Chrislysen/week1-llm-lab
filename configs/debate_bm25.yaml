# Copy of debate.yaml with ONE thing changed: the context policy (BM25-ranked older messages under a 250-word budget).
# Week 3: one parameter at a time. Run: python run.py --config configs/debate_bm25.yaml [--mock]

topic: "Cities should ban private cars from their centres."

budget:
  max_turns: 8
  max_tokens: 4000
  max_seconds: 120

agents:
  - name: Pro
    system_prompt: >
      Debate topic: Cities should ban private cars from their centres.
      You argue IN FAVOUR. Make one concrete point per turn.
      Be brief: at most 2 sentences. Address the other speaker's last point.
    model: "llama3.2:3b"
    temperature: 0.7

  - name: Con
    system_prompt: >
      Debate topic: Cities should ban private cars from their centres.
      You argue AGAINST. Make one concrete point per turn.
      Be brief: at most 2 sentences. Address the other speaker's last point.
    model: "llama3.2:3b"
    temperature: 0.7

output: "transcripts/debate_bm25.json"

context:
  policy: bm25
  max_words: 250

